! Golden SECURE Cisco IOS-XE switch baseline (§25).
! Every automatable control below must PASS; several controls are MANUAL
! and must be REVIEW (never FAIL).
hostname SECURE-SWITCH-01
!
aaa new-model
aaa authentication login default local
aaa authentication enable default enable
aaa authorization exec default local
aaa accounting exec default start-stop group tacacs+
!
username admin privilege 15 secret 9 $9$encryptedhashvalue
!
security passwords min-length 14
enable secret 9 $9$anotherencryptedhash
service password-encryption
!
ip ssh version 2
ip ssh authentication-retries 3
ip ssh time-out 60
!
line con 0
 exec-timeout 5 0
 login local
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ACCESS in
line aux 0
 no exec
 exec-timeout 5 0
!
ip access-list standard MGMT-ACCESS
 permit 10.0.0.0 0.0.255.255
!
no ip http server
ip http secure-server
ip http authentication aaa
!
no cdp run
no lldp run
!
interface GigabitEthernet1/0/1
 description UPLINK-TO-CORE
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 spanning-tree portfast trunk
 ip dhcp snooping trust
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
interface GigabitEthernet1/0/2
 description ACCESS-PORT
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 storm-control broadcast level 5.00
 ip arp inspection trust
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
interface range GigabitEthernet1/0/3 - 48
 shutdown
!
vlan 10
 name USERS
vlan 20
 name SERVERS
!
ip dhcp snooping
ip dhcp snooping vlan 10,20
ip arp inspection vlan 10,20
!
no ip source-route
!
no service finger
no service pad
no service tcp-small-servers
no service udp-small-servers
!
service timestamps log datetime msec
logging buffered 64000 informational
logging console warnings
logging monitor warnings
logging trap informational
logging host 10.0.0.53
logging source-interface Loopback0
!
ntp server 10.0.0.10
ntp server 10.0.0.11
ntp authenticate
ntp authentication-key 1 md5 7 06050E2A5B41
ntp trusted-key 1
ntp source Loopback0
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
!
snmp-server group NETADMIN v3 priv
snmp-server user netadmin NETADMIN v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server host 10.0.0.54 version 3 priv netadmin
!
end
