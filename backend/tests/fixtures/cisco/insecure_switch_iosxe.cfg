! Golden INSECURE Cisco IOS-XE switch baseline (§26).
! Contains intentional violations; each must be an explicit FAIL.
hostname INSECURE-SWITCH-01
!
! no AAA at all — weak local auth only
username admin privilege 15 password cisco123
!
ip ssh version 1
!
line con 0
 login
line vty 0 15
 login
 transport input telnet
 access-class 99 out
!
ip http server
ip http port 8080
!
cdp run
lldp run
!
interface GigabitEthernet1/0/1
 description "transport input ssh"
 switchport mode access
 no shutdown
!
interface GigabitEthernet1/0/2
 switchport mode access
 no shutdown
 ip redirects
 ip unreachables
 ip proxy-arp
!
ip source-route
!
service finger
service pad
service tcp-small-servers
service udp-small-servers
!
snmp-server community public RO
snmp-server community private RW
!
logging buffered 4096 debugging
!
ntp server 10.0.0.10
!
end
