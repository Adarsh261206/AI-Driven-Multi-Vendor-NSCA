# Fortinet FortiGate — Permissive Firewall
# Bad security posture for testing
#
# hostname: FW-EDGE-01

config system global
    set hostname FW-EDGE-01
    set admin-password M33tM3!
    set admin-port 80
    set admin-https-ssl-min-ver TLSv1
    set gui-trust-hosts 1
end

config system interface
    edit "port1"
        set alias "WAN"
        set mode static
        set ip 203.0.113.10 255.255.255.252
        set allowaccess ping https ssh
    next
    edit "port2"
        set alias "LAN"
        set mode static
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh
    next
end

config firewall policy
    edit 1
        set name "Allow-All-Inbound"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set schedule "always"
        set logtraffic all
    next
    edit 2
        set name "Allow-All-Outbound"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action accept
        set schedule "always"
        set logtraffic all
    next
end

config firewall addrgrp
    edit "Trusted-Hosts"
        set member "10.0.0.0/8" "192.168.0.0/16"
    next
end

config system snmp community
    edit 1
        set name public
        set query-v2c-status enable
    next
end

config vpn ipsec phase1-interface
    edit "site-to-site"
        set interface "port1"
        set ike-version 1
        set peertype any
        set net-device disable
        set proposal aes128-md5
        set remote-gw 198.51.100.1
        set psksecret Presh@redK3y!
    next
end
