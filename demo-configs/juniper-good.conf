! Juniper Junos — Hardened Router
! Better config
!
set system host-name JUNIPER-SECURE-01
set system root-authentication encrypted-password "$6$rounds=5000$saltsalt$H4rdCr4ckP@ssHash"
set system services ssh protocol-version 2
set system services ssh max-sessions-per-connection 5
set system services netconf ssh
set system login user admin class super-user authentication plain-text-password-password S3cur3Adm1n!
set system login attempt-options authenticate-without-password
set system login lockout threshold 5
set system login lockout lockout-period 300
set system login lockout lockout-reset 600
set system syslog file messages any info
set system syslog file messages archive size 10m
set system syslog file messages archive files 5
set system ntp server 10.0.0.10
!
set interfaces ge-0/0/0 unit 0 family inet address 203.0.113.5/30
set interfaces ge-0/0/1 unit 0 family inet address 10.0.0.1/24
set interfaces ge-0/0/2 unit 0 family inet address 172.16.0.1/24
!
set firewall family inet filter INBOUND term ALLOW_SSH from source-address 10.0.10.0/24
set firewall family inet filter INBOUND term ALLOW_SSH from protocol tcp
set firewall family inet filter INBOUND term ALLOW_SSH from destination-port 22
set firewall family inet filter INBOUND term ALLOW_SSH then accept
set firewall family inet filter INBOUND term ALLOW_HTTPS from source-address 10.0.10.0/24
set firewall family inet filter INBOUND term ALLOW_HTTPS from protocol tcp
set firewall family inet filter INBOUND term ALLOW_HTTPS from destination-port 443
set firewall family inet filter INBOUND term ALLOW_HTTPS then accept
set firewall family inet filter INBOUND term DENY_ALL then discard
!
set interfaces ge-0/0/0 unit 0 family inet filter input INBOUND
!
set routing-options static route 0.0.0.0/0 next-hop 203.0.113.1
!
set security policies from-zone untrust to-zone trust policy ALLOW-HTTPS match-source-address Trusted-Networks
set security policies from-zone untrust to-zone trust policy ALLOW-HTTPS match-destination-address DMZ-Servers
set security policies from-zone untrust to-zone trust policy ALLOW-HTTPS match-application junos-https
set security policies from-zone untrust to-zone trust policy ALLOW-HTTPS then permit
set security policies from-zone untrust to-zone trust policy ALLOW-HTTPS then log close
set security policies from-zone untrust to-zone trust policy DENY-ALL match-source-address any
set security policies from-zone untrust to-zone trust policy DENY-ALL match-destination-address any
set security policies from-zone untrust to-zone trust policy DENY-ALL match-application any
set security policies from-zone untrust to-zone trust policy DENY-ALL then deny
set security policies from-zone untrust to-zone trust policy DENY-ALL then log close
!
set security address-book address Trusted-Networks 10.0.10.0/24
set security address-book address Trusted-Networks 10.0.20.0/24
set security address-book address DMZ-Servers 172.16.0.10/32
!
set protocols ssh
set protocols ntp
!
set security ike proposal IKE-PROPOSAL authentication-method pre-shared-keys
set security ike proposal IKE-PROPOSAL dh-group group20
set security ike proposal IKE-PROPOSAL authentication-algorithm sha-256
set security ike proposal IKE-PROPOSAL encryption-algorithm aes-256-cbc
!
commit
