!
! ConfigShield - Cisco IOS-XE Router Audit Fixture
! Device: Enterprise Edge Router
! Purpose: Compliance-auditor validation fixture
! NOTE: This is a TEST configuration. Replace all CHANGE_ME values
! and validate commands against the exact IOS/IOS-XE release.
!
version 17.12
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname EDGE-RTR-01
!
boot-start-marker
boot-end-marker
!
enable secret <CHANGE_ME_ENABLE_SECRET>
!
username netadmin privilege 15 secret <CHANGE_ME_ADMIN_SECRET>
username helpdesk privilege 1 secret <CHANGE_ME_HELPDESK_SECRET>
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting exec default start-stop
!
ip domain name enterprise.local
ip name-server 10.20.30.53
no ip domain lookup
!
crypto key generate rsa modulus 3072
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Management source interface is intentionally not defined here.
!
!
! ================================================================
! LOGGING / TIME
! ================================================================
!
logging buffered 16384 informational
logging console notifications
logging monitor notifications
logging host 10.20.30.20
!
ntp authenticate
ntp authentication-key 1 md5 <CHANGE_ME_NTP_KEY>
ntp trusted-key 1
ntp server 10.20.30.21 key 1
ntp server 10.20.30.22 key 1
!
!
! ================================================================
! SNMP
! ================================================================
!
no snmp-server community public
no snmp-server community private
snmp-server view SECUREVIEW iso included
snmp-server group NMS-GROUP v3 priv read SECUREVIEW
snmp-server user nmsadmin NMS-GROUP v3 auth sha <CHANGE_ME_SNMP_AUTH> priv aes 256 <CHANGE_ME_SNMP_PRIV>
snmp-server host 10.20.30.30 version 3 priv nmsadmin
!
!
! ================================================================
! MANAGEMENT SERVICES
! ================================================================
!
! Intentionally left enabled for audit testing.
ip http server
no ip http secure-server
!
! Intentionally insecure legacy service for audit testing.
service finger
!
!
! ================================================================
! GLOBAL IP SECURITY
! ================================================================
!
! Intentionally left enabled for audit testing.
ip source-route
!
!
! ================================================================
! MANAGEMENT ACL
! ================================================================
!
ip access-list standard MGMT-ACCESS
 remark Approved management subnet
 permit 10.20.40.0 0.0.0.255
 deny any log
!
!
! ================================================================
! LOOPBACK - ROUTER ID / MANAGEMENT
! ================================================================
!
interface Loopback0
 description Router-ID-and-management
 ip address 10.255.255.1 255.255.255.255
 no ip redirects
 no ip proxy-arp
 no ip unreachables
!
!
! ================================================================
! WAN INTERFACE
! ================================================================
!
interface GigabitEthernet0/0/0
 description WAN-UPLINK
 ip address 203.0.113.2 255.255.255.252
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 no cdp enable
 no lldp transmit
 no lldp receive
!
!
! ================================================================
! LAN INTERFACE
! ================================================================
!
interface GigabitEthernet0/0/1
 description INTERNAL-LAN
 ip address 10.20.10.1 255.255.255.0
 !
 ! Intentionally leaves proxy ARP enabled for audit testing.
 ip proxy-arp
 no ip redirects
 no ip unreachables
 no cdp enable
!
!
! ================================================================
! DMZ INTERFACE
! ================================================================
!
interface GigabitEthernet0/0/2
 description DMZ
 ip address 10.20.20.1 255.255.255.0
 no ip redirects
 no ip proxy-arp
 !
 ! Intentionally leaves IP unreachables enabled for audit testing.
 ip unreachables
!
!
! ================================================================
! UNUSED INTERFACE
! ================================================================
!
interface GigabitEthernet0/0/3
 description UNUSED-INTERFACE
 shutdown
!
!
! ================================================================
! OSPF
! ================================================================
!
router ospf 10
 router-id 10.255.255.1
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 network 10.255.255.1 0.0.0.0 area 0
 network 10.20.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 0
!
!
! ================================================================
! VTY - SECURE BLOCK
! ================================================================
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ACCESS in
 logging synchronous
!
!
! ================================================================
! VTY - INTENTIONALLY WEAK BLOCK
! ================================================================
!
line vty 5 15
 login local
 transport input telnet
 exec-timeout 30 0
 logging synchronous
!
!
! ================================================================
! CONSOLE
! ================================================================
!
line console 0
 login local
 exec-timeout 10 0
 logging synchronous
!
!
! ================================================================
! AUX
! ================================================================
!
line aux 0
 no exec
 exec-timeout 5 0
!
!
! ================================================================
! BANNER
! ================================================================
!
banner motd ^
****************************************************************
* AUTHORIZED ACCESS ONLY                                       *
* This system is restricted to authorized personnel.           *
* Unauthorized access may be monitored and recorded.            *
****************************************************************
^
!
end
