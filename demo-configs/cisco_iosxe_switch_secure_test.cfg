!
! ConfigShield Cisco IOS-XE Switch Test Fixture
! Platform: Cisco IOS-XE 17.x
!
version 17.12
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname EDGE-SW-01
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username netadmin privilege 15 secret <CHANGE_ME_ADMIN_SECRET>
username operator privilege 1 secret <CHANGE_ME_OPERATOR_SECRET>
enable secret <CHANGE_ME_ENABLE_SECRET>
security passwords min-length 14
!
ip domain-name corp.example
crypto key generate rsa modulus 3072
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
no ip http secure-server
no ip source-route
no service finger
no service pad
no service tcp-small-servers
no service udp-small-servers
!
ip access-list standard MGMT-ACL
 permit 10.10.10.0 0.0.0.255
 deny any log
!
line console 0
 login local
 exec-timeout 10 0
 logging synchronous
!
line aux 0
 no exec
 exec-timeout 5 0
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ACL in
 logging synchronous
!
no snmp-server community public
no snmp-server community private
snmp-server view SECUREVIEW iso included
snmp-server group NMS-GROUP v3 priv read SECUREVIEW
snmp-server user nmsadmin NMS-GROUP v3 auth sha <CHANGE_ME_SNMP_AUTH> priv aes 256 <CHANGE_ME_SNMP_PRIV>
snmp-server host 10.10.20.20 version 3 priv nmsadmin
!
ntp authenticate
ntp authentication-key 1 md5 <CHANGE_ME_NTP_KEY>
ntp trusted-key 1
ntp server 10.10.10.10 key 1
!
logging buffered 16384 informational
logging console warnings
logging monitor warnings
logging host 10.10.20.30
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
ip arp inspection vlan 10,20,30
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name VOICE
vlan 999
 name UNUSED-BLACKHOLE
!
interface GigabitEthernet1/0/1
 description USER-01-SECURE
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 storm-control broadcast level 1.00 0.50
 storm-control multicast level 1.00 0.50
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
interface GigabitEthernet1/0/2
 description USER-02-SECURE
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
interface GigabitEthernet1/0/3
 description SERVER-01
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
interface GigabitEthernet1/0/4
 description PHONE-01
 switchport mode access
 switchport access vlan 30
 switchport voice vlan 30
 switchport port-security
 switchport port-security maximum 3
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
interface GigabitEthernet1/0/48
 description UPLINK-CORE-SW
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 ip dhcp snooping trust
 ip arp inspection trust
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
interface range GigabitEthernet1/0/5-47
 description UNUSED-PORT
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan10
 description MANAGEMENT-SVI
 ip address 10.10.10.2 255.255.255.0
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
no cdp run
no lldp run
!
banner motd ^
************************************************************
* AUTHORIZED ACCESS ONLY                                   *
* Unauthorized use is prohibited and may be monitored.    *
************************************************************
^
!
end
