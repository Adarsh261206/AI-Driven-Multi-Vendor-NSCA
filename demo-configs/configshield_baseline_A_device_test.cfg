!
! ConfigShield Company Baseline A - Device Audit Fixture
! Purpose: test organization-level Company Baseline scoping.
! Baseline A contains 17 CIS controls; this device config intentionally
! contains a mixture of compliant, non-compliant, and review-worthy states.
!
version 17.12
hostname BASELINE-A-TEST-RTR
!
service timestamps debug datetime msec
service timestamps log datetime msec
!
no ip http server
no ip http secure-server
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
username admin privilege 15 secret 0 ConfigShield-Test-Admin
!
ip domain name configshield.test
crypto key generate rsa modulus 2048
ip ssh version 2
!
! Deliberate management-control cases
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Deliberate SNMP violation for CIS 1.5.2
snmp-server community CONFIGSHIELD_RW RW
snmp-server community CONFIGSHIELD_RO RO
!
! Logging / NTP configuration
logging buffered 16384 informational
logging console critical
logging monitor errors
logging host 192.0.2.50
!
ntp server 192.0.2.10
ntp server 192.0.2.11
!
! VTY configuration
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 login authentication default
!
line vty 5 9
 exec-timeout 10 0
 transport input ssh
 login authentication default
!
! Deliberate timeout deviation for one VTY range
line vty 10 15
 exec-timeout 15 0
 transport input ssh
 login authentication default
!
! Interface test cases
interface GigabitEthernet1/0/1
 description CONFIGSHIELD-TEST-UPLINK
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet1/0/2
 description CONFIGSHIELD-TEST-DOWN
 shutdown
!
interface GigabitEthernet1/0/3
 description CONFIGSHIELD-TEST-UPLINK-2
 ip address 10.10.20.1 255.255.255.0
 no shutdown
!
interface Loopback0
 description CONFIGSHIELD-MANAGEMENT
 ip address 192.0.2.1 255.255.255.255
 no shutdown
!
! ACL with remarks to exercise evidence/remark handling
ip access-list extended MGMT-ACCESS
 remark CONFIGSHIELD TEST - this is a remark, not a permit/deny rule
 permit tcp 10.10.0.0 0.0.255.255 any eq 22
 deny ip any any log
!
interface GigabitEthernet1/0/1
 ip access-group MGMT-ACCESS in
!
end
