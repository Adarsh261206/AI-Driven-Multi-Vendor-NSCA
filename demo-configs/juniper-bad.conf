! Juniper Junos — Router
! Bad config for testing
!
set system host-name JUNIPER-RTR-01
set system root-authentication plain-text-password-password RootPass123
set system services ssh
set system services telnet
set system login user admin class super-user plain-text-password-password Admin123
set system syslog file messages any info
set system ntp server 10.0.0.10
!
set interfaces ge-0/0/0 unit 0 family inet address 203.0.113.5/30
set interfaces ge-0/0/1 unit 0 family inet address 10.0.0.1/24
set interfaces ge-0/0/2 unit 0 family inet address 172.16.0.1/24
!
set firewall family inet filter INBOUND term ALLOW_SSH from source-address 0.0.0.0/0
set firewall family inet filter INBOUND term ALLOW_SSH from protocol tcp
set firewall family inet filter INBOUND term ALLOW_SSH from destination-port 22
set firewall family inet filter INBOUND term ALLOW_SSH then accept
set firewall family inet filter INBOUND term ALLOW_TELNET from protocol tcp
set firewall family inet filter INBOUND term ALLOW_TELNET from destination-port 23
set firewall family inet filter INBOUND term ALLOW_TELNET then accept
set firewall family inet filter INBOUND term DENY_ALL then discard
!
set interfaces ge-0/0/0 unit 0 family inet filter input INBOUND
!
set routing-options static route 0.0.0.0/0 next-hop 203.0.113.1
!
set protocols ssh
set protocols ntp
!
set security policies from-zone untrust to-zone trust policy ALLOW-ALL match-source-address any
set security policies from-zone untrust to-zone trust policy ALLOW-ALL match-destination-address any
set security policies from-zone untrust to-zone trust policy ALLOW-ALL match-application any
set security policies from-zone untrust to-zone trust policy ALLOW-ALL then permit
!
commit
