!
! ============================================================================
! ConfigShield V4 adversarial router fixture - Cisco IOS-XE (router)
! Hostname: ADV-RTR-V4-01
!
! Purpose: deterministic adversarial validation of the audit engine against
! scope, conflict-resolution, evidence-classification and applicability
! defects (V4-1..V4-11). Content A-AM. Verdicts are computed, not pinned:
! expected results (53 CIS controls) documented in
! backend/tests/test_cisco_v4_router.py.
!
! Deliberate traps carried by this fixture:
!   A.  ip http server (early) vs no ip http server (late)  -> IOS last-wins
!   B.  no ip source-route (early) vs ip source-route (late) -> last-wins FAIL
!   C.  logging console warnings -> logging console debugging (last-wins FAIL)
!   D.  logging console/monitor NUMERIC severities (typed parse)
!   E.  ntp authentication-key WITHOUT ntp authenticate      -> not authenticated
!   F.  ACL definitions + interface ip access-group but NO VTY access-class
!   G.  ACL remarks and banner payload containing command-like text
!   H.  source-interface conflicts (first vs last statement)
!   I.  shutdown interfaces carrying violations (must be excluded)
!   J.  subinterface with ip redirects under a compliant parent
!   K.  root statements after interface/router blocks (section closure)
!   L.  unknown syntax (object service) - parser sanity, no crash
! ============================================================================
!
hostname ADV-RTR-V4-01
!
boot-start-marker
!
enable secret 5 $1$V4Ad$K7mN2pQ9xR4tY6uW8sD0fG3hJ5kL1nB2
!
security passwords min-length 14
service password-encryption
!
aaa new-model
aaa authentication login default local
aaa authentication enable default local
aaa accounting commands 15 default start-stop local
aaa accounting connection default start-stop local
aaa accounting exec default start-stop local
aaa accounting network default start-stop local
aaa accounting system default start-stop local
!
! --- SSH hardening (2.1.1-2.1.5); H: source-interface conflict pair ---
ip ssh version 2
ip ssh authentication-retries 3
ip ssh timeout 600
ip ssh stricthostkeycheck
ip ssh source-interface Loopback0
ip ssh source-interface GigabitEthernet0/0/0
!
! --- global services (early statements; A/B first half) ---
no ip source-route
ip http server
ip http authentication aaa
no service finger
no service pad
no service tcp-small-servers
no service udp-small-servers
no cdp run
!
! --- logging (C/D/H traps) ---
service timestamps log datetime msec
logging buffered 64000 6
logging source-interface Loopback0
logging source-interface GigabitEthernet0/0/0
logging trap informational
logging console warnings
logging monitor 4
logging host 10.30.0.53
!
! --- SNMP (1.5.2 RW violation + RO community) ---
snmp-server community monitor RO 99
snmp-server community private RW
snmp-server group v3 priv
snmp-server user ops monitoring v3 access 99
snmp-server location V4 Adversarial Lab
!
! --- NTP (E: keys defined, authenticate intentionally absent; H conflict) ---
ntp server 10.30.0.10 key 9
ntp server 10.30.0.11 key 9
ntp authentication-key 9 md5 06050E2A5B41 7
ntp trusted-key 9
ntp source Loopback0
ntp source GigabitEthernet0/0/0
!
ipv6 unicast-routing
ipv6 route 2001:DB8::/32 2001:DB8:0:1::1
!
! --- routing processes; K: root ip route statements follow this block ---
router ospf 1
 router-id 10.30.0.1
 network 10.30.0.0 0.0.0.255 area 0
 default-information originate
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 10.30.9.1 remote-as 65002
 address-family ipv4 unicast
  network 10.30.0.0 mask 255.255.255.0
 exit-address-family
!
ip route 0.0.0.0 0.0.0.0 10.30.0.1 name DEFAULT-GW
ip route vrf CUST 192.168.50.0 255.255.255.0 10.50.0.1
ip route 10.40.0.0 255.255.0.0 10.30.0.2
!
! --- ACLs (F/G: definitions + remarks carrying command-like text) ---
ip access-list extended MGMT-ACL
 remark Restrict management plane to SSH
 permit tcp 10.30.0.0 0.0.0.255 host 10.30.0.1 eq 22
 remark no lldp run
 deny ip any any
!
ip access-list standard NAT-LIST
 permit 10.30.0.0 0.0.0.255
!
access-list 99 remark legacy note Loopback0
access-list 99 permit 10.0.0.0 0.0.0.255
!
ip nat inside source list NAT-LIST interface GigabitEthernet0/0/0 overload
!
! --- DHCP / control-plane / unknown syntax (L) noise ---
ip dhcp pool CUST-Pool
 network 192.168.50.0 255.255.255.0
 default-router 192.168.50.1
 dns-server 10.30.0.53
!
control-plane
 service-policy input CP-MAP
!
object service OBJ-HTTP
 service tcp destination eq 8080
!
! --- VRFs (opposite route-targets; never cross-contaminating) ---
vrf definition MGMT
 description Management VRF
 address-family ipv4 unicast
  route-target both 65001:100
 exit-address-family
!
vrf definition CUST
 description Customer VRF
 address-family ipv4 unicast
  route-target both 65001:200
 exit-address-family
!
! --- interfaces (I/J/K traps) ---
interface GigabitEthernet0/0/0
 description Inside LAN - compliant parent
 ip address 10.30.0.1 255.255.255.0
 ip access-group MGMT-ACL in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/0.10
 description Guest subinterface - explicit violation (J)
 encapsulation dot1Q 10
 ip address 10.30.10.1 255.255.255.0
 ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/0.20
 description Quarantine subinterface - shutdown with violations (I)
 encapsulation dot1Q 20
 ip address 10.30.20.1 255.255.255.0
 ip unreachables
 ip proxy-arp
 shutdown
!
interface GigabitEthernet0/0/1
 description User LAN - shutdown with violation (I)
 ip address 192.168.10.1 255.255.255.0
 ip unreachables
 shutdown
!
interface range GigabitEthernet0/0/2-3
 description Uplink range - fully compliant
 ip address 10.31.0.1 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0
 description Management access - VRF MGMT
 vrf forwarding MGMT
 ip address 10.99.0.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface Serial0/1/0
 description WAN - compliant
 encapsulation ppp
 ip address 10.32.0.1 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
!
interface Loopback0
 description Router identity
 ip address 10.30.255.1 255.255.255.255
!
interface Loopback10
 shutdown
!
! --- late globals (A/B/C second half; IOS last-wins decides) ---
no ip http server
ip source-route
logging console debugging
!
! --- lines (1.2.x; VTY 5-9 carries telnet + long timeout) ---
line con 0
 exec-timeout 5 0
 logging synchronous
!
line aux 0
 no exec
 exec-timeout 10 0
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
!
line vty 5 9
 exec-timeout 15 0
 transport input ssh telnet
!
line vty 10 15
 exec-timeout 7 0
 transport input ssh
!
! --- banner (G: payload carries command-like text; never evidence) ---
banner motd ^
************************************************************
* ADV-RTR-V4-01 - AUTHORIZED ACCESS ONLY                   *
* hint: no lldp run and interface Loopback0                *
************************************************************
^
!
end
