!
! ================================================================
! CISCO ENTERPRISE SWITCH SECURITY BASELINE
! CIS / NIST SP 800-53 ALIGNED
! ================================================================
!
! IMPORTANT:
! - Replace ALL <CHANGE_ME> values before deployment.
! - Validate commands against the exact IOS/IOS-XE release.
! - Test in lab before production deployment.
!
! ================================================================
! 1. DEVICE IDENTITY
! ================================================================

hostname SECURE-SWITCH-01

no ip domain-lookup
ip domain-name enterprise.local

!
! ================================================================
! 2. PRIVILEGED ACCESS
! ================================================================

enable secret <CHANGE_ME_STRONG_ENABLE_SECRET>

!
! Local emergency/admin account
!
username netadmin privilege 15 secret <CHANGE_ME_STRONG_PASSWORD>

!
! Encrypt legacy plaintext passwords where applicable
!
service password-encryption

!
! ================================================================
! 3. SSH MANAGEMENT - NIST AC-17 / IA-2
! ================================================================

crypto key generate rsa modulus 3072

ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

!
! Disable insecure Telnet by allowing only SSH on VTY
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 10 0
 session-timeout 10
 logging synchronous
 access-class MGMT-ACCESS in
 exit

!
! ================================================================
! 4. MANAGEMENT ACCESS CONTROL
! ================================================================

ip access-list standard MGMT-ACCESS
 remark ONLY trusted management networks may access the switch
 permit <MGMT_SUBNET> <WILDCARD_MASK>
 deny any log
 exit

!
! Example:
! permit 10.10.10.0 0.0.0.255
!

!
! ================================================================
! 5. LOGIN BRUTE-FORCE PROTECTION
! ================================================================

login block-for 120 attempts 3 within 60
login quiet-mode access-class MGMT-ACCESS
login delay 2
login on-failure log
login on-success log

!
! ================================================================
! 6. CONSOLE SECURITY
! ================================================================

line console 0
 login local
 exec-timeout 10 0
 logging synchronous
 exit

!
! ================================================================
! 7. PRIVILEGE / SESSION SECURITY
! ================================================================

privilege exec level 1 show
privilege exec level 1 ping
privilege exec level 1 traceroute

!
! ================================================================
! 8. HTTP/HTTPS MANAGEMENT
! ================================================================

no ip http server
no ip http secure-server

!
! If web management is specifically required,
! enable HTTPS only and restrict it using an ACL.
!

!
! ================================================================
! 9. CDP / LLDP
! ================================================================
!
! Disable globally if not required.
!

no cdp run
no lldp run

!
! ================================================================
! 10. DNS SECURITY
! ================================================================

no ip bootp server

!
! ================================================================
! 11. NTP - NIST AU-8
! ================================================================

ntp authenticate
ntp authentication-key 1 md5 <CHANGE_ME_NTP_KEY>
ntp trusted-key 1

ntp server <NTP_SERVER_1> key 1
ntp server <NTP_SERVER_2> key 1

!
! ================================================================
! 12. LOGGING / AUDIT - NIST AU-2 / AU-3 / AU-12
! ================================================================

service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone

logging buffered 16384 informational
logging console warnings
logging monitor warnings

logging host <SYSLOG_SERVER>

!
! ================================================================
! 13. CONFIGURATION CHANGE LOGGING
! ================================================================

archive
 log config
  logging enable
  logging size 100
  notify syslog
  hidekeys
 path flash:/config-archive/$h-$t
 write-memory
 exit

!
! ================================================================
! 14. SNMP SECURITY
! ================================================================
!
! Remove legacy SNMP communities
!

no snmp-server community public
no snmp-server community private

!
! SNMPv3 user
!
snmp-server view SECUREVIEW iso included

snmp-server group NMS-GROUP v3 priv read SECUREVIEW

snmp-server user nmsadmin NMS-GROUP v3 auth sha <CHANGE_ME_AUTH_PASSWORD> priv aes 256 <CHANGE_ME_PRIV_PASSWORD>

snmp-server host <SNMP_SERVER> version 3 priv nmsadmin

!
! Optional:
!
snmp-server ifindex persist

!
! ================================================================
! 15. AAA
! ================================================================
!
! Local fallback baseline.
! For production, preferably use TACACS+/RADIUS.
!

aaa new-model

aaa authentication login default local
aaa authorization exec default local

aaa accounting exec default start-stop group tacacs+

!
! If TACACS+ is deployed:
!
! tacacs server TACACS01
!  address ipv4 <TACACS_SERVER>
!  key <CHANGE_ME_TACACS_KEY>
!
! aaa group server tacacs+ TACACS-GROUP
!  server name TACACS01
!
! aaa authentication login default group TACACS-GROUP local
! aaa authorization exec default group TACACS-GROUP local
! aaa accounting exec default start-stop group TACACS-GROUP

!
! ================================================================
! 16. SPANNING TREE SECURITY
! ================================================================

spanning-tree mode rapid-pvst

!
! Protect access ports from rogue BPDUs
!
spanning-tree portfast bpduguard default

!
! ================================================================
! 17. DHCP SNOOPING
! ================================================================
!
! Enable only on VLANs using DHCP.
!

ip dhcp snooping
ip dhcp snooping vlan <USER_VLANS>

!
! Do NOT trust access ports.
!
! Trust ONLY legitimate DHCP server/uplink ports.

!
! Example:
! interface GigabitEthernet1/0/48
!  ip dhcp snooping trust
!

!
! ================================================================
! 18. DYNAMIC ARP INSPECTION
! ================================================================

ip arp inspection vlan <USER_VLANS>

!
! Trust only uplink/DHCP infrastructure interfaces.
!

!
! ================================================================
! 19. IP SOURCE GUARD
! ================================================================
!
! Apply to DHCP-enabled access ports.
!

!
! interface range GigabitEthernet1/0/1-47
!  ip verify source
!

!
! ================================================================
! 20. PORT SECURITY
! ================================================================

interface range GigabitEthernet1/0/1-47
 description USER_ACCESS_PORTS

 switchport mode access
 switchport access vlan <USER_VLAN>

 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security aging time 5
 switchport port-security aging type inactivity

 spanning-tree portfast
 spanning-tree bpduguard enable

 ip dhcp snooping limit rate 15

!
! ================================================================
! 21. UNUSED PORT SECURITY
! ================================================================

interface range GigabitEthernet1/0/48
 description UNUSED_PORT

 shutdown

!
! For multiple unused interfaces:
!
! interface range GigabitEthernet1/0/20-47
!  description UNUSED_PORT
!  shutdown
!  switchport mode access
!  switchport access vlan 999

!
! ================================================================
! 22. BLACK-HOLE VLAN FOR UNUSED PORTS
! ================================================================

vlan 999
 name UNUSED-BLACKHOLE

!
! ================================================================
! 23. STORM CONTROL
! ================================================================

interface range GigabitEthernet1/0/1-47

 storm-control broadcast level 1.00 0.50
 storm-control multicast level 1.00 0.50
 storm-control unicast level 1.00 0.50

 exit

!
! ================================================================
! 24. PORTFAST GLOBAL PROTECTION
! ================================================================

spanning-tree portfast bpduguard default

!
! ================================================================
! 25. ROOT GUARD
! ================================================================
!
! Apply only to designated downstream/access-facing interfaces.
!
! interface range GigabitEthernet1/0/1-47
!  spanning-tree guard root
!

!
! ================================================================
! 26. CONTROL PLANE PROTECTION
! ================================================================
!
! Platform-specific.
! Validate supported CoPP syntax for your IOS-XE version.
!

!
! ================================================================
! 27. IPV6 HARDENING
! ================================================================
!
! If IPv6 is not used in the environment:
!

no ipv6 unicast-routing

!
! ================================================================
! 28. SOURCE ROUTING
! ================================================================

no ip source-route

!
! ================================================================
! 29. ICMP REDIRECTS / SECURITY
! ================================================================

no ip redirects
no ip proxy-arp

!
! ================================================================
! 30. UNNECESSARY SERVICE HARDENING
! ================================================================

no service tcp-small-servers
no service udp-small-servers

!
! ================================================================
! 31. BOOT / CRASH INFORMATION
! ================================================================

service sequence-numbers

!
! ================================================================
! 32. LOGIN BANNER
! ================================================================

banner motd ^
****************************************************************
*  AUTHORIZED ACCESS ONLY                                      *
*                                                              *
*  This device is restricted to authorized personnel.          *
*  Unauthorized access is prohibited and may be monitored.     *
****************************************************************
^

!
! ================================================================
! 33. CONFIGURATION PROTECTION
! ================================================================

security passwords min-length 14

!
! ================================================================
! 34. MANAGEMENT VRF - OPTIONAL
! ================================================================
!
! Recommended for enterprise deployments where supported.
!
! ip vrf MGMT
!  rd 65000:10
!

!
! ================================================================
! 35. SAVE CONFIGURATION
! ================================================================

end

write memory

!
! ================================================================
! END OF BASELINE
! ================================================================