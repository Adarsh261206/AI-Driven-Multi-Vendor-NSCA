# Fortinet FortiGate — Hardened Config
# Better security posture
#
# hostname: FW-SECURE-01

config system global
    set hostname FW-SECURE-01
    set admin-password Sup3rS3cur3!
    set admin-port 8443
    set admin-https-ssl-min-ver TLSv1_2
    set admin-https-ssl-cipher-suites high
    set admin-ssh-grace-time 120
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set gui-trust-hosts 1
    set hostname-mask 255.255.255.0
end

config system interface
    edit "port1"
        set alias "WAN"
        set mode static
        set ip 203.0.113.10 255.255.255.252
        set allowaccess ping https
        set role wan
    next
    edit "port2"
        set alias "LAN"
        set mode static
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping
        set role lan
    next
    edit "port3"
        set alias "DMZ"
        set mode static
        set ip 172.16.0.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
end

config firewall policy
    edit 1
        set name "WAN-to-LAN-HTTPS"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "Trusted-Hosts"
        set dstaddr "Server-Farm"
        set service "HTTPS"
        set action accept
        set schedule "business-hours"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "LAN-to-WAN-HTTPS"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "User-Network"
        set dstaddr "all"
        set service "HTTPS" "DNS"
        set action accept
        set schedule "always"
        set logtraffic all
        set nat enable
    next
    edit 3
        set name "DMZ-Web-Server"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "Web-Server"
        set service "HTTPS" "HTTP"
        set action accept
        set schedule "always"
        set logtraffic all
        set ips-sensor "protect-https"
        set profile-protocol-options "web-protocol"
        set ssl-ssh-profile "deep-inspection"
    next
    edit 4
        set name "Deny-All"
        set srcintf "port1"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set schedule "always"
        set logtraffic all
    next
end

config firewall addrgrp
    edit "Trusted-Hosts"
        set member "10.0.10.0/24" "10.0.20.0/24"
    next
    edit "Server-Farm"
        set member "10.0.0.100/32" "10.0.0.101/32"
    next
    edit "User-Network"
        set member "192.168.1.0/24" "192.168.2.0/24"
    next
end

config vpn ipsec phase1-interface
    edit "site-to-site"
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set remote-gw 198.51.100.1
        set psksecret V3ryL0ngS3cur3K3y!@#$%^
        set dpd-retrycount 3
        set dpd-retryinterval 10
    next
end

config system snmp community
    edit 1
        set name monitoring
        set query-v2c-status disable
        set hosts "10.0.10.50/32"
    next
end

config log syslogd setting
    set status enable
    set server "10.0.10.100"
    set port 514
    set mode udp
end
