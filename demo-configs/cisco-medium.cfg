! Cisco IOS-XE — Firewall Router
! Better config but still has issues
!
hostname FW-RTR-01
!
enable secret F!rew@ll2024
!
no ip http server
ip http secure-server
!
username firewall-admin privilege 15 secret S3cureP@ss!
!
crypto key generate rsa modulus 2048
!
interface GigabitEthernet0/0
 description WAN
 ip address 203.0.113.5 255.255.255.252
 ip access-group WAN-IN in
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 10.0.0.1 255.255.255.0
 no shutdown
!
ip access-list extended WAN-IN
 permit tcp any host 203.0.113.5 eq 443
 permit tcp any host 203.0.113.5 eq 22
 deny ip any any
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
!
logging buffered 16384 informational
logging trap warnings
!
ntp server 10.0.0.10
!
end
