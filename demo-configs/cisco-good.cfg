! Cisco IOS-XE — Best Practice Config
! Clean config with good security
!
hostname SECURE-CORE-01
!
enable secret Secur3K3y!@#2024
!
no ip http server
ip http secure-server
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
username netops privilege 15 secret N3t0ps!Ssh2024
!
crypto key generate rsa modulus 4096
!
service password-encryption
!
banner motd ^^^
 unauthorized access is prohibited
 all activity is logged and monitored
^^^
!
interface GigabitEthernet0/0
 description TRUNK to Distribution
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
!
interface GigabitEthernet0/1
 description ACCESS — Server Farm
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface Vlan10
 description Management
 ip address 10.0.10.1 255.255.255.0
 no ip proxy-arp
!
interface Vlan20
 description User VLAN
 ip address 10.0.20.1 255.255.255.0
 no ip proxy-arp
!
ip access-list extended MGMT-ACL
 permit tcp 10.0.10.0 0.0.0.255 any eq 22
 permit tcp 10.0.10.0 0.0.0.255 any eq 443
 deny ip any any log
!
line vty 0 15
 login local
 transport input ssh
 exec-timeout 3 0
 access-class MGMT-ACL in
!
logging buffered 32768 informational
logging trap warnings
logging host 10.0.10.100
!
ntp server 10.0.10.10
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
enable algorithm-type scrypt secret NewAdmin2024!
!
archive
 log config
  logging enable
!
end
