!
! ConfigShield - Cisco IOS-XE Switch V2 Generalization Fixture
! Purpose:
!   Fresh fixture to test parser/normalizer/evidence/compliance behavior
!   against a configuration different from the V1 golden fixture.
!
version 17.12
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname CAMPUS-DIST-SW-02
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username secadmin privilege 15 secret <CHANGE_ME_SECADMIN_SECRET>
username helpdesk privilege 5 secret <CHANGE_ME_HELPDESK_SECRET>
enable secret <CHANGE_ME_ENABLE_SECRET>
security passwords min-length 14
!
ip domain-name campus.example
crypto key generate rsa modulus 3072
ip ssh version 2
ip ssh time-out 45
ip ssh authentication-retries 3
!
! Management services
no ip http server
no ip http secure-server
!
! Global security services
no ip source-route
no service finger
no service pad
no service tcp-small-servers
no service udp-small-servers
!
! Management access
ip access-list standard SWITCH-MGMT
 permit 10.20.40.0 0.0.0.255
 deny any log
!
line console 0
 login local
 exec-timeout 8 0
 logging synchronous
!
line aux 0
 no exec
 exec-timeout 3 0
!
! Deliberately use two VTY blocks to test block separation
line vty 0 4
 login local
 transport input ssh
 exec-timeout 7 0
 access-class SWITCH-MGMT in
 logging synchronous
!
line vty 5 15
 login local
 transport input ssh
 exec-timeout 12 0
 access-class SWITCH-MGMT in
 logging synchronous
!
! SNMPv3
no snmp-server community public
no snmp-server community private
snmp-server view MONITOR-VIEW iso included
snmp-server group MONITOR-GROUP v3 priv read MONITOR-VIEW
snmp-server user monitor MONITOR-GROUP v3 auth sha <CHANGE_ME_SNMP_AUTH> priv aes 256 <CHANGE_ME_SNMP_PRIV>
snmp-server host 10.20.50.20 version 3 priv monitor
!
! NTP authentication
ntp authenticate
ntp authentication-key 7 md5 <CHANGE_ME_NTP_KEY>
ntp trusted-key 7
ntp server 10.20.50.11 key 7
ntp server 10.20.50.12 key 7
!
! Logging
logging buffered 32768 informational
logging console errors
logging monitor informational
logging host 10.20.50.30
!
! Deliberately no logging source-interface:
! this should NOT satisfy a source-interface control.
!
! Layer-2 protections
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
ip dhcp snooping
ip dhcp snooping vlan 110,120,130
ip arp inspection vlan 110,120,130
!
vlan 110
 name STAFF
vlan 120
 name SERVERS
vlan 130
 name VOICE
vlan 999
 name UNUSED
!
! Interface 1 - explicitly secure
interface GigabitEthernet1/0/1
 description STAFF-01
 switchport mode access
 switchport access vlan 110
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 20
 storm-control broadcast level 1.00 0.50
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! Interface 2 - deliberately insecure for negative testing
interface GigabitEthernet1/0/2
 description STAFF-02-TEST-VIOLATION
 switchport mode access
 switchport access vlan 110
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip redirects
 ip unreachables
 ip proxy-arp
!
! Interface 3 - partially hardened
! Redirects and proxy ARP are disabled, unreachables intentionally enabled.
interface GigabitEthernet1/0/3
 description STAFF-03-PARTIAL
 switchport mode access
 switchport access vlan 110
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip redirects
 ip unreachables
 no ip proxy-arp
!
! Interface 4 - explicit secure server port
interface GigabitEthernet1/0/4
 description SERVER-APP-01
 switchport mode access
 switchport access vlan 120
 switchport port-security
 switchport port-security maximum 4
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! Interface range - separate scope object
interface range GigabitEthernet1/0/5-20
 description UNUSED-BLOCK-A
 switchport mode access
 switchport access vlan 999
 shutdown
!
! Interface 21 intentionally leaves the three interface features
! unconfigured to test ABSENT/UNKNOWN semantics.
interface GigabitEthernet1/0/21
 description STAFF-21-UNSPECIFIED
 switchport mode access
 switchport access vlan 110
 shutdown
!
! Interface 22 explicitly secure but with different command ordering
interface GigabitEthernet1/0/22
 description STAFF-22-ORDER-TEST
 switchport mode access
 switchport access vlan 110
 no ip proxy-arp
 spanning-tree portfast
 no ip unreachables
 switchport port-security
 no ip redirects
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree bpduguard enable
!
! Interface 23 contains a comment that must NOT become evidence.
interface GigabitEthernet1/0/23
 description STAFF-23-COMMENT-TEST
 switchport mode access
 switchport access vlan 110
 ! no ip redirects
 ! no ip unreachables
 ! no ip proxy-arp
 shutdown
!
! Trunk/uplink with explicit secure L3-related settings
interface GigabitEthernet1/0/24
 description UPLINK-DISTRIBUTION
 switchport mode trunk
 switchport trunk allowed vlan 110,120,130
 ip dhcp snooping trust
 ip arp inspection trust
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! Second range with different range width
interface range GigabitEthernet1/0/25-36
 description UNUSED-BLOCK-B
 switchport mode access
 switchport access vlan 999
 shutdown
!
! Management SVI
interface Vlan110
 description MANAGEMENT-SVI
 ip address 10.20.40.2 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! Loopback for control applicability testing
interface Loopback10
 description MANAGEMENT-LOOPBACK
 ip address 10.20.255.2 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! Discovery protocols explicitly disabled
no cdp run
no lldp run
!
banner motd ^
************************************************************
* AUTHORIZED ACCESS ONLY                                   *
* CAMPUS-DIST-SW-02                                       *
* Unauthorized use is prohibited and may be monitored.    *
************************************************************
^
!
end
