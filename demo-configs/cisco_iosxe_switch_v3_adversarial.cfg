!
! ConfigShield - Cisco IOS-XE Switch V3 ADVERSARIAL FIXTURE
! Purpose: Stress-test parser, scope, normalization, negation,
! applicability, evidence lineage, conflict resolution and reporting.
! TEST FIXTURE ONLY - NOT FOR PRODUCTION DEPLOYMENT.
!
version 17.12
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname ADV-SW-V3-01
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username auditadmin privilege 15 secret <CHANGE_ME_AUDIT_SECRET>
username readonly privilege 1 secret <CHANGE_ME_READONLY_SECRET>
enable secret <CHANGE_ME_ENABLE_SECRET>
security passwords min-length 14
!
ip domain-name adversarial.example
crypto key generate rsa modulus 3072
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
no ip http secure-server
no ip source-route
no service finger
no service pad
no service tcp-small-servers
no service udp-small-servers
!
ip access-list standard ADV-MGMT
 permit 10.30.40.0 0.0.0.255
 deny any log
!
line console 0
 login local
 exec-timeout 10 0
 logging synchronous
!
line aux 0
 no exec
 exec-timeout 2 30
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 access-class ADV-MGMT in
!
line vty 5 9
 login local
 transport input ssh
 exec-timeout 1 0
 access-class ADV-MGMT in
!
line vty 10 15
 login local
 transport input ssh
 exec-timeout 15 0
 access-class ADV-MGMT in
!
no snmp-server community public
no snmp-server community private
snmp-server community OBSERVE RO ADV-MGMT
snmp-server community OPERATE RW ADV-MGMT
snmp-server view ADV-VIEW iso included
snmp-server group ADV-GROUP v3 priv read ADV-VIEW
snmp-server user snmpaudit ADV-GROUP v3 auth sha <CHANGE_ME_SNMP_AUTH> priv aes 256 <CHANGE_ME_SNMP_PRIV>
snmp-server host 10.30.50.20 version 3 priv snmpaudit
!
ntp authenticate
ntp authentication-key 9 md5 <CHANGE_ME_NTP_KEY>
ntp trusted-key 9
ntp server 10.30.50.11 key 9
!
logging buffered 32768 informational
logging console warnings
logging monitor errors
logging host 10.30.50.30
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
ip dhcp snooping
ip dhcp snooping vlan 210,220,230
ip arp inspection vlan 210,220,230
!
vlan 210
 name USERS
vlan 220
 name SERVERS
vlan 230
 name VOICE
vlan 999
 name QUARANTINE
!
! CASE A: fully secure baseline
interface GigabitEthernet1/0/1
 description A-SECURE-BASELINE
 switchport mode access
 switchport access vlan 210
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! CASE B: explicit violation
interface GigabitEthernet1/0/2
 description B-EXPLICIT-VIOLATION
 switchport mode access
 switchport access vlan 210
 ip redirects
 ip unreachables
 ip proxy-arp
!
! CASE C: mixed state
interface GigabitEthernet1/0/3
 description C-MIXED
 switchport mode access
 switchport access vlan 210
 no ip redirects
 ip unreachables
 no ip proxy-arp
!
! CASE D: duplicate conflict, final explicit command wins
interface GigabitEthernet1/0/4
 description D-DUPLICATE-CONFLICT
 switchport mode access
 switchport access vlan 210
 no ip redirects
 ip redirects
 no ip unreachables
 ip unreachables
 no ip proxy-arp
 ip proxy-arp
!
! CASE E: reverse duplicate conflict
interface GigabitEthernet1/0/5
 description E-REVERSE-CONFLICT
 switchport mode access
 switchport access vlan 210
 ip redirects
 no ip redirects
 ip unreachables
 no ip unreachables
 ip proxy-arp
 no ip proxy-arp
!
! CASE F: comment only - must not become evidence
interface GigabitEthernet1/0/6
 description F-COMMENT-ONLY
 switchport mode access
 switchport access vlan 210
 ! no ip redirects
 ! no ip unreachables
 ! no ip proxy-arp
!
! CASE G: remediation-like description - must not become evidence
interface GigabitEthernet1/0/7
 description "REMEDIATION: no ip redirects; no ip unreachables; no ip proxy-arp"
 switchport mode access
 switchport access vlan 210
!
! CASE H: shutdown then no shutdown
interface GigabitEthernet1/0/8
 description H-LIFECYCLE-TRANSITION
 switchport mode access
 switchport access vlan 210
 shutdown
 no shutdown
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! CASE I: no shutdown then shutdown
interface GigabitEthernet1/0/9
 description I-FINAL-SHUTDOWN
 switchport mode access
 switchport access vlan 210
 no shutdown
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 shutdown
!
! CASE J: secure range, then shutdown
interface range GigabitEthernet1/0/10-14
 description J-RANGE-SECURE
 switchport mode access
 switchport access vlan 210
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 shutdown
!
! CASE K: range then individual override
interface range GigabitEthernet1/0/15-19
 description K-RANGE-BASE
 switchport mode access
 switchport access vlan 210
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
interface GigabitEthernet1/0/17
 description K-INDIVIDUAL-OVERRIDE
 switchport mode access
 switchport access vlan 210
 ip redirects
 ip unreachables
 ip proxy-arp
!
! CASE L: individual then new range
interface GigabitEthernet1/0/20
 description L-INDIVIDUAL-BEFORE-RANGE
 switchport mode access
 switchport access vlan 210
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
interface range GigabitEthernet1/0/20-22
 description L-RANGE-AFTER-INDIVIDUAL
 switchport mode access
 switchport access vlan 210
 ip redirects
 ip unreachables
 ip proxy-arp
!
! CASE M: same commands, different ordering
interface GigabitEthernet1/0/23
 description M-ORDER-TEST
 switchport access vlan 210
 no ip proxy-arp
 switchport mode access
 no ip unreachables
 spanning-tree portfast
 no ip redirects
!
! CASE N: whitespace/case normalization test
interface GigabitEthernet1/0/24
 description N-WHITESPACE
 switchport mode access
 switchport access vlan 210
 NO IP REDIRECTS
 no    ip    unreachables
 no ip    proxy-arp
!
! CASE O: trunk with explicit security
interface GigabitEthernet1/0/25
 description O-TRUNK
 switchport mode trunk
 switchport trunk allowed vlan 210,220,230
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 ip dhcp snooping trust
 ip arp inspection trust
!
! CASE P: disabled range without security commands
interface range GigabitEthernet1/0/26-30
 description P-DISABLED-RANGE
 switchport mode access
 switchport access vlan 999
 shutdown
!
! CASE Q: unspecified feature state
interface GigabitEthernet1/0/31
 description Q-UNSPECIFIED
!
! CASE R: noisy conflicting commands, ends secure
interface GigabitEthernet1/0/32
 description R-NOISY
 ip redirects
 ip proxy-arp
 ip unreachables
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 no ip redirects
!
! CASE S: SVI
interface Vlan210
 description S-SVI-MANAGEMENT
 ip address 10.30.40.2 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! CASE T: loopback
interface Loopback20
 description T-LOOPBACK
 ip address 10.30.255.2 255.255.255.255
 no ip redirects
 no ip unreachables
 no ip proxy-arp
!
! CASE U: global-looking text in comments must not satisfy interface controls
! no ip redirects
! no ip unreachables
! no ip proxy-arp
!
no cdp run
no lldp run
!
banner motd ^
************************************************************
* AUTHORIZED ACCESS ONLY                                   *
* ADVERSARIAL CONFIGURATION TEST FIXTURE                  *
* Device: ADV-SW-V3-01                                    *
************************************************************
^
!
end
