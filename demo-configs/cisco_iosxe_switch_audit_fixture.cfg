!
! ConfigShield — Cisco IOS-XE Switch Audit Fixture
! Purpose: adversarial compliance test configuration
! Device: Cisco Catalyst-style IOS-XE switch
! Hostname: CORE-SW-01
!
version 17.12
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service finger
!
hostname CORE-SW-01
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting exec default start-stop group tacacs+
!
username netadmin privilege 15 secret <CHANGE_ME_ADMIN_SECRET>
username helpdesk privilege 1 secret <CHANGE_ME_HELPDESK_SECRET>
enable secret <CHANGE_ME_ENABLE_SECRET>
security passwords min-length 14
!
ip domain-name enterprise.local
crypto key generate rsa modulus 3072
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Deliberately insecure: HTTP enabled
ip http server
no ip http secure-server
!
! Management ACL
ip access-list standard MGMT-ACCESS
 permit 10.10.10.0 0.0.0.255
 deny any log
!
line console 0
 login local
 exec-timeout 10 0
 logging synchronous
!
line aux 0
 no exec
 exec-timeout 5 0
!
! VTY block 0-4 is secure
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-ACCESS in
 logging synchronous
!
! VTY block 5-15 deliberately insecure
line vty 5 15
 login local
 transport input telnet
 exec-timeout 30 0
 access-class MGMT-ACCESS in
 logging synchronous
!
!
! SNMPv3
no snmp-server community public
no snmp-server community private
snmp-server view SECUREVIEW iso included
snmp-server group NMS-GROUP v3 priv read SECUREVIEW
snmp-server user nmsadmin NMS-GROUP v3 auth sha <CHANGE_ME_SNMP_AUTH> priv aes 256 <CHANGE_ME_SNMP_PRIV>
snmp-server host 10.10.20.20 version 3 priv nmsadmin
!
! NTP
ntp authenticate
ntp authentication-key 1 md5 <CHANGE_ME_NTP_KEY>
ntp trusted-key 1
ntp server 10.10.20.10 key 1
!
! Logging
logging buffered 16384 informational
logging console notifications
logging monitor notifications
logging host 10.10.20.30
!
! Deliberately insecure global services
ip source-route
!
! Spanning Tree
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
! DHCP Snooping / DAI
ip dhcp snooping
ip dhcp snooping vlan 10,20,30
ip arp inspection vlan 10,20,30
!
! VLANs
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 30
 name VOICE
vlan 999
 name UNUSED-BLACKHOLE
!
!
! ------------------------------------------------------------
! ACCESS PORT 1 - secure
! ------------------------------------------------------------
interface GigabitEthernet1/0/1
 description USER-01-SECURE
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 storm-control broadcast level 1.00 0.50
 storm-control multicast level 1.00 0.50
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! ACCESS PORT 2 - deliberately insecure proxy ARP
! ------------------------------------------------------------
interface GigabitEthernet1/0/2
 description USER-02-PROXY-ARP-VIOLATION
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 ip proxy-arp
 no ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! ACCESS PORT 3 - deliberately insecure redirects
! ------------------------------------------------------------
interface GigabitEthernet1/0/3
 description USER-03-REDIRECT-VIOLATION
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no ip proxy-arp
 ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! ACCESS PORT 4 - deliberately insecure unreachables
! ------------------------------------------------------------
interface GigabitEthernet1/0/4
 description USER-04-UNREACHABLE-VIOLATION
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no ip proxy-arp
 no ip redirects
 ip unreachables
!
! ------------------------------------------------------------
! ACCESS PORT 5 - secure
! ------------------------------------------------------------
interface GigabitEthernet1/0/5
 description USER-05-SECURE
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! ACCESS PORT 6 - deliberately missing port-security
! ------------------------------------------------------------
interface GigabitEthernet1/0/6
 description USER-06-NO-PORT-SECURITY
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! ACCESS PORT 7 - deliberately insecure source-route-related
! Note: global source-route is already enabled above.
! ------------------------------------------------------------
interface GigabitEthernet1/0/7
 description USER-07-SOURCE-ROUTE-GLOBAL-TEST
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! TRUNK / UPLINK - trusted infrastructure
! ------------------------------------------------------------
interface GigabitEthernet1/0/48
 description UPLINK-CORE
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 ip dhcp snooping trust
 ip arp inspection trust
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
! ------------------------------------------------------------
! UNUSED PORTS
! ------------------------------------------------------------
interface range GigabitEthernet1/0/8-47
 description UNUSED-PORT
 switchport mode access
 switchport access vlan 999
 shutdown
!
! ------------------------------------------------------------
! Management SVI
! ------------------------------------------------------------
interface Vlan10
 description MANAGEMENT-SVI
 ip address 10.10.10.2 255.255.255.0
 no ip proxy-arp
 no ip redirects
 no ip unreachables
!
! Deliberately enabled CDP globally
cdp run
!
! LLDP deliberately partially configured, not globally disabled
lldp run
!
banner motd ^
************************************************************
* AUTHORIZED ACCESS ONLY                                   *
* Unauthorized use is prohibited and may be monitored.    *
************************************************************
^
!
end
!
! END OF FIXTURE
!
